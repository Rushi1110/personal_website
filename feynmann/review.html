<!doctype html>
<!--
Review with Feynmann: after a test, go back over wrong and blank questions, and right ones whose working hides a flaw.
Feynmann looks at the student's own working (pauses and erasures marked), quotes the line where it went off, asks why,
and leads them to the answer without giving it. The student replies by typing, or by writing on the board (blue).

Needs the ink server (npx vite pilot/ink-capture → http://localhost:4175/review.html) for /api/review and /api/check.
Opens the test just finished (from test.html), or any test JSON with "Open test file".
Every call's tokens and cost are shown live and saved in the review file (Download review).
  lib/facts.mjs  what code measures (status, trap, steps, pauses, signals)   lib/ink.mjs  drawing, replay, snapshot
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review with Feynmann</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
  [hidden] { display: none !important; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
         font: 16px system-ui, sans-serif; background: #f6f4ef; color: #222; }
  header { padding: 10px 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  #title { font-weight: 600; }
  #meter { margin-left: auto; font: 13px ui-monospace, monospace; color: #555; }
  #nav { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 16px 8px; }
  #nav button { padding: 4px 10px; font-size: 13px; border: 1px solid #bbb; background: #fff; }
  #nav .wrong { border-color: #b3261e; color: #b3261e; }
  #nav .blank { border-color: #8a6d1d; color: #8a6d1d; }
  #nav .right { border-color: #2f6b4f; color: #2f6b4f; }
  #nav .flaw { border-color: #b3261e; color: #2f6b4f; border-style: dashed; }
  #nav .resolved { background: #2f6b4f; color: #fff; border-color: #2f6b4f; }
  #nav .cur { outline: 2px solid #222; }
  main { flex: 1; min-height: 0; display: flex; gap: 12px; padding: 0 16px 12px; }
  #left { flex: 3; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  #q { font-size: 18px; line-height: 1.35; display: flex; gap: 12px; align-items: flex-start; }
  #facts { font-size: 13px; color: #555; }
  canvas { flex: 1 1 0; min-height: 0; width: 100%; background: #fff; border: 1px solid #ccc; touch-action: none; cursor: crosshair; }
  .tools { display: flex; gap: 8px; align-items: center; font-size: 13px; color: #555; }
  #chat { flex: 2; min-width: 0; display: flex; flex-direction: column; background: #fff; border: 1px solid #ccc; }
  #log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .m { max-width: 92%; padding: 8px 12px; border-radius: 10px; line-height: 1.4; }
  .feynmann { background: #f1ede4; align-self: flex-start; }
  .student { background: #e3ecfb; align-self: flex-end; }
  .note { align-self: center; font-size: 13px; color: #666; }
  .note.time, .note.habit { align-self: stretch; padding: 6px 10px; border-radius: 8px; background: #fff4e6; color: #8a4b00; }
  .note.habit { background: #fff0f6; color: #a61e4d; }
  .fbd { margin-top: 6px; background: #fff; border-radius: 6px; }
  .err { color: #b3261e; }
  .ts { color: #1a56db; font-weight: 600; }
  .video { align-self: stretch; border: 1px solid #ddd; border-radius: 10px; padding: 8px; background: #faf8f3; font-size: 13px; color: #555; }
  .video .vhead { font-weight: 600; border: none; background: none; padding: 0; color: #b3261e; cursor: pointer; }
  .video .vmeta { margin-top: 2px; }
  .note.read .vask { display: block; text-align: left; margin-top: 6px; color: #1d2433; background: #fffdf8; }
  .vask { align-self: flex-start; border: 1px solid #ddd; border-radius: 10px; padding: 6px 10px; background: #faf8f3; color: #b3261e; font-size: 13px; cursor: pointer; }
  .video iframe { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; margin-top: 6px; border-radius: 6px; }
  .flag { align-self: flex-start; font-size: 12px; padding: 2px 8px; background: none; border: 1px solid #ccc; color: #666; }
  form { display: flex; gap: 8px; padding: 8px; border-top: 1px solid #ddd; }
  textarea { flex: 1; font: inherit; padding: 8px; resize: none; height: 56px; }
  input, button, select { font: inherit; padding: 6px 12px; }
  button.on { background: #222; color: #fff; }
  @media (max-width: 800px) { main { flex-direction: column; } #chat { flex: 1; } }
  .note.read { align-self: stretch; padding: 8px 10px; border-radius: 8px; background: #f3f1ea; color: #333; text-align: left; display: flex; flex-direction: column; gap: 4px; }
  .note.read b { color: var(--c, #333); }
  .note.read .why { color: #555; }
  /* ---- the quiz report: beyond the score ---- */
  #nav .sum { font-weight: 600; border-color: #1d3557; color: #1d3557; }
  #nav .sum.cur { background: #1d3557; color: #fff; }
  #report { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 40px; }
  #report .in { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
  #report h2 { font: 600 13px system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #6b6f78; margin: 0 0 10px; }
  #report p { margin: 0; line-height: 1.5; max-width: 72ch; }
  .hero { display: flex; gap: 28px; align-items: flex-end; flex-wrap: wrap; }
  .hero .big { font: 600 54px/1 Georgia, serif; color: #1d3557; }
  .hero .big small { font-size: 22px; color: #8a8f99; }
  .hero p { flex: 1; min-width: 260px; font-size: 17px; }
  .bar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: #e8e5dc; }
  .bar i { display: block; height: 100%; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: #555; margin-top: 8px; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--c); margin-right: 6px; vertical-align: -1px; }
  .next { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .card { background: #fff; border: 1px solid #e2ded3; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .card .t { font-weight: 600; }
  .card .why { font-size: 14px; color: #555; }
  .card .do { font-size: 14px; }
  .card.learn { border-color: #2f5d8a; } .card .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
  .card .acts a.btn { background: #1d2433; color: #fff; padding: 6px 12px; border-radius: 8px; text-decoration: none; font-size: 14px; }
  .card .vid iframe { width: 100%; aspect-ratio: 16 / 9; border: 0; margin-top: 8px; }
  .card .m { align-self: flex-start; font-size: 12px; font-weight: 600; color: #0f7a5c; background: #e6f2ec; padding: 1px 8px; border-radius: 999px; max-width: none; }
  .rows { display: flex; flex-direction: column; gap: 8px; }
  .row { display: grid; grid-template-columns: 76px 1fr; gap: 12px; align-items: start; background: #fff; border: 1px solid #e2ded3; border-radius: 10px; padding: 10px 14px; }
  .chip { font-size: 12px; font-weight: 600; text-align: center; padding: 2px 0; border-radius: 999px; color: #fff; background: var(--c); }
  .row .fix { font-size: 14px; color: #555; margin-top: 4px; }
  .ladder { display: grid; grid-template-columns: minmax(120px, 200px) 1fr; gap: 6px 14px; align-items: center; font-size: 14px; }
  .steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
  .steps i { height: 12px; border-radius: 3px; background: #e8e5dc; }
  .qstrip { display: flex; flex-wrap: wrap; gap: 6px; }
  .qstrip button { border: 0; border-radius: 8px; padding: 6px 10px; color: #fff; background: var(--c); font-size: 13px; cursor: pointer; }
  .soft { color: #777; font-size: 13px; }
</style>
  <script type="module" crossorigin src="./assets/review-tmvDR5SY.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/api-D58nCSqn.js">
  <link rel="modulepreload" crossorigin href="./assets/heart-Bgebh81I.js">
</head>
<body>
<header>
  <span id="title">Review with Feynmann</span>
  <a href="index.html" class="home">← Home</a>
  <label id="fileLabel">Open test file <input type="file" id="file" accept=".json,application/json"></label>
  <button id="dl" hidden>Download review</button>
  <a id="profile" href="profile.html" target="_blank">What Feynmann knows about you</a>
  <span id="meter"></span>
</header>
<div id="nav"></div>
<section id="report" hidden><div class="in" id="rep"></div></section>
<main id="main" hidden>
  <section id="left">
    <div id="q"></div>
    <div id="facts"></div>
    <canvas id="c"></canvas>
    <div class="tools">
      <button id="play">▶ Replay</button>
      <input type="range" id="scrub" min="0" max="1000" value="1000" style="flex:1">
      <select id="speed" title="Replay speed">
        <option value="1">1×</option><option value="4" selected>4×</option><option value="10">10×</option><option value="30">30×</option>
      </select>
      <label title="Jump over gaps longer than 2 seconds"><input type="checkbox" id="skipIdle" checked> skip pauses</label>
      <span id="clock"></span>
      <button id="eraser">Eraser (E)</button>
    </div>
    <div class="tools">
      <span>Black: your test working, numbers show the order you wrote it. Write in blue to reply: a new step, or circle a line.</span>
    </div>
  </section>
  <section id="chat">
    <div id="log"></div>
    <form id="f">
      <textarea id="msg" placeholder="Type your reply, or write on the board, then Send"></textarea>
      <button id="send">Send</button>
    </form>
  </section>
</main>

</body>
</html>
