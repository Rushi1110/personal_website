<!doctype html>
<!-- A student's first visit (27 Nov): goal → exam and colleges → last mock → rate the topics → pen check → starting test →
     daily time, then the road (road.html). Each step is saved to the server as it's answered (student-save), so a student
     can stop and come back. Design: https://claude.ai/artifact/8Em92Zj8MVt71D9PBak7Na -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feynmann · Getting started</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
  :root { --bg: #f6f1e7; --card: #fffdf8; --ink: #1d2433; --soft: #6b6559; --line: #e5ddcc; --teal: #1f6f6b; --tint: #e7f0ee; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 Inter, system-ui, sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 18px 24px; border-bottom: 1px solid var(--line); }
  .brand { font-family: Fraunces, Georgia, serif; font-size: 22px; font-weight: 600; }
  .bar { height: 4px; background: var(--line); } .bar i { display: block; height: 100%; background: var(--teal); transition: width .3s; }
  main { max-width: 820px; margin: 0 auto; padding: 36px 20px 120px; }
  h1 { font-family: Fraunces, Georgia, serif; font-size: 34px; font-weight: 600; line-height: 1.2; margin: 0 0 22px; }
  .soft { color: var(--soft); } .lab { font-size: 13px; font-weight: 600; color: var(--soft); margin: 18px 0 8px; letter-spacing: .02em; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
  .pick { font: inherit; color: inherit; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
  .pick[aria-pressed="true"] { border: 2px solid var(--ink); padding: 21px; }
  .pick b { font-family: Fraunces, Georgia, serif; font-size: 26px; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { font: inherit; font-size: 15px; padding: 10px 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); font-weight: 600; }
  .checks { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px 16px; }
  .checks label { display: flex; gap: 10px; align-items: center; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; }
  .row { display: grid; grid-template-columns: 2fr repeat(5, minmax(70px, 1fr)); gap: 10px; align-items: end; }
  .row label { font-size: 12px; font-weight: 600; color: var(--soft); display: flex; flex-direction: column; gap: 4px; }
  input[type=text], input[type=number], select { font: inherit; font-size: 15px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; width: 100%; }
  .rate { display: grid; grid-template-columns: 1.4fr repeat(4, minmax(0, 1fr)); gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid #efe8da; }
  .rate.head { border: 0; font-size: 12px; font-weight: 600; color: var(--soft); }
  .rate button { font: inherit; font-size: 13px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--soft); cursor: pointer; }
  .rate button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); font-weight: 600; }
  .note { background: var(--tint); border-radius: 14px; padding: 14px 18px; margin-top: 18px; }
  .steps { display: flex; flex-direction: column; gap: 10px; }
  .step { display: flex; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-weight: 600; }
  .dot { width: 28px; height: 28px; flex: none; border-radius: 50%; background: var(--tint); color: var(--teal); display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .step.ok .dot { background: var(--teal); color: #fff; }
  .pad { position: relative; height: 240px; background: var(--card) repeating-linear-gradient(transparent 0 59px, #efe8da 59px 60px); border: 2px solid var(--teal); border-radius: 16px; touch-action: none; }
  .pad canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .pad span { position: absolute; left: 16px; top: 10px; font-size: 13px; font-weight: 600; color: var(--teal); pointer-events: none; }
  .penlayout { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 24px; }
  @media (max-width: 640px) { .penlayout, .row { grid-template-columns: 1fr; } .rate { grid-template-columns: 1fr 1fr; } }
  footer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); }
  footer div { max-width: 820px; margin: 0 auto; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .btn { font: inherit; font-size: 15px; font-weight: 600; background: var(--ink); color: #fff; border: 0; border-radius: 999px; padding: 13px 28px; cursor: pointer; text-decoration: none; }
  .btn:disabled { opacity: .35; cursor: default; }
  .link { font: inherit; background: none; border: 0; padding: 0; color: var(--ink); text-decoration: underline; cursor: pointer; }
</style>
  <script type="module" crossorigin src="./assets/start-B0sosYzp.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/api-IPfG4NkI.js">
</head>
<body>
<header><div class="brand">Feynmann</div><div class="soft" id="count" style="font-size: 13px"></div></header>
<div class="bar"><i id="bar" style="width: 0"></i></div>
<main id="main"><p class="soft">Loading…</p></main>
<footer><div><button class="link" id="back">Back</button><span style="display: flex; gap: 18px; align-items: center"><button class="link soft" id="skip" hidden></button><button class="btn" id="next">Continue</button></span></div></footer>
</body>
</html>
