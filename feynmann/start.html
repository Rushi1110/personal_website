<!doctype html>
<!-- A student's first visit (27 Nov; redesigned 28 Nov after the first walk-through): goal → exam and colleges → last mock →
     past papers → rate the topics → pen check → daily time → the starting test (a sitting: test.html?sit=start), then the
     road (road.html). Each answer is saved the moment it's picked (student-save), so a student can stop and come back. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feynmann · Getting started</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<style>
  :root { --bg: #f6f1e7; --card: #fffdf8; --ink: #1d2433; --soft: #6b6559; --line: #e5ddcc; --teal: #1f6f6b; --tint: #e7f0ee; --gold: #b8832b; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 Inter, system-ui, sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 18px 28px; }
  .brand { font-family: Fraunces, Georgia, serif; font-size: 22px; font-weight: 600; }
  .dots { display: flex; gap: 6px; } .dots i { width: 22px; height: 5px; border-radius: 3px; background: var(--line); transition: background .3s; } .dots i.on { background: var(--teal); }
  main { max-width: 760px; margin: 0 auto; padding: 28px 20px 140px; }
  .enter { animation: rise .38s cubic-bezier(.2, .7, .2, 1) both; }
  .enter > * { animation: rise .45s cubic-bezier(.2, .7, .2, 1) both; } .enter > *:nth-child(2) { animation-delay: .05s; } .enter > *:nth-child(3) { animation-delay: .1s; } .enter > *:nth-child(4) { animation-delay: .15s; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .enter, .enter > * { animation: none; } }
  .kicker { font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--teal); text-transform: uppercase; margin-bottom: 8px; }
  h1 { font-family: Fraunces, Georgia, serif; font-size: 36px; font-weight: 600; line-height: 1.15; margin: 0 0 10px; }
  .sub { color: var(--soft); font-size: 17px; margin: 0 0 28px; }
  .lab { font-size: 13px; font-weight: 700; color: var(--soft); letter-spacing: .06em; margin: 28px 0 10px; }
  .tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(var(--min, 160px), 1fr)); }
  .tile { position: relative; font: inherit; color: inherit; text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; padding: 16px 18px;
          cursor: pointer; transition: border-color .15s, box-shadow .15s, transform .15s; display: flex; flex-direction: column; gap: 4px; }
  .tile:hover { border-color: #c9bda6; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(29, 36, 51, .06); }
  .tile[aria-pressed="true"] { border-color: var(--teal); background: #f2f8f6; box-shadow: 0 0 0 1px var(--teal) inset; }
  .tile[aria-pressed="true"]::after { content: "✓"; position: absolute; top: 10px; right: 12px; width: 22px; height: 22px; border-radius: 50%; background: var(--teal); color: #fff; font-size: 13px; display: grid; place-items: center; }
  .tile b { font-size: 17px; } .tile .soft { font-size: 14px; }
  .big { padding: 26px 24px; gap: 8px; } .big b { font-family: Fraunces, Georgia, serif; font-size: 30px; font-weight: 600; }
  .big svg { width: 34px; height: 34px; color: var(--teal); margin-bottom: 4px; }
  .soft { color: var(--soft); }
  .count { margin-top: 22px; display: flex; align-items: baseline; gap: 12px; background: var(--ink); color: #fff; border-radius: 18px; padding: 18px 24px; }
  .count b { font-family: Fraunces, Georgia, serif; font-size: 52px; font-weight: 600; line-height: 1; color: #f3d9a4; }
  .count span { font-size: 17px; opacity: .9; }
  .form { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
  .form label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--soft); }
  .form .wide { grid-column: 1 / -1; }
  input[type=text], input[type=number] { font: inherit; font-size: 16px; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); width: 100%; color: var(--ink); }
  input:focus { outline: none; border-color: var(--teal); }
  .rates { display: flex; flex-direction: column; gap: 10px; }
  .rate { display: grid; grid-template-columns: minmax(150px, 1fr) minmax(0, 3fr); gap: 14px; align-items: center; background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; padding: 12px 14px 12px 18px; }
  .rate b { font-size: 16px; }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .seg button { font: inherit; font-size: 13px; line-height: 1.25; min-height: 42px; padding: 6px 8px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--soft); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 600; }
  .points { display: flex; flex-direction: column; gap: 12px; background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; padding: 22px 24px; }
  .points div { display: flex; gap: 14px; align-items: flex-start; font-size: 17px; }
  .points i { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--tint); color: var(--teal); font-style: normal; font-weight: 700; font-size: 14px; display: grid; place-items: center; }
  .pad { position: relative; height: 300px; background: var(--card) repeating-linear-gradient(transparent 0 59px, #efe8da 59px 60px); border: 2px solid var(--teal); border-radius: 18px; touch-action: none; }
  .pad canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; background: linear-gradient(transparent, var(--bg) 30%); }
  footer div { max-width: 760px; margin: 0 auto; padding: 26px 20px 22px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .btn { font: inherit; font-size: 16px; font-weight: 700; background: var(--teal); color: #fff; border: 0; border-radius: 999px; padding: 14px 32px; cursor: pointer; transition: transform .12s, opacity .2s; }
  .btn:hover:not(:disabled) { transform: translateY(-1px); } .btn:disabled { opacity: .3; cursor: default; }
  .link { font: inherit; background: none; border: 0; padding: 0; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  @media (max-width: 640px) { h1 { font-size: 29px; } .form { grid-template-columns: 1fr 1fr; } .rate { grid-template-columns: 1fr; } .count b { font-size: 42px; } }
</style>
  <script type="module" crossorigin src="./assets/start--lB3OpIl.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/api-IPfG4NkI.js">
  <link rel="modulepreload" crossorigin href="./assets/road-C5Kfh8DW.js">
</head>
<body>
<header><div class="brand">Feynmann</div><div class="dots" id="dots" aria-hidden="true"></div></header>
<main id="main"><p class="soft">Loading…</p></main>
<footer><div><button class="link" id="back">Back</button><span style="display: flex; gap: 22px; align-items: center"><button class="link soft" id="skip" hidden></button><button class="btn" id="next">Continue</button></span></div></footer>
</body>
</html>
