<!doctype html>
<!-- A XAT student's Home (27 Nov): the road from their topic ratings to the exam. Stops unlock in order; a mock test is a
     checkpoint that opens only once every stop before it is done. Built by rule from the profile (start.html), nothing
     from a model: weakest topics first; a topic rated "never" or "easy ones" gets a basics stop before its XAT-level stop. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feynmann · Your road</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
  :root { --bg: #f6f1e7; --card: #fffdf8; --ink: #1d2433; --soft: #6b6559; --line: #e5ddcc; --teal: #1f6f6b; --gold: #b8832b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 Inter, system-ui, sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 24px; border-bottom: 1px solid var(--line); }
  .brand { font-family: Fraunces, Georgia, serif; font-size: 22px; font-weight: 600; }
  header nav { display: flex; gap: 18px; font-size: 14px; } header a { color: var(--soft); text-decoration: none; }
  main { max-width: 1000px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-family: Fraunces, Georgia, serif; font-size: 30px; font-weight: 600; margin: 0; }
  .soft { color: var(--soft); }
  .today { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; background: var(--card); border: 2px solid var(--teal); border-radius: 20px; padding: 20px 24px; margin: 18px 0 8px; }
  .today b { font-family: Fraunces, Georgia, serif; font-size: 24px; font-weight: 600; display: block; }
  .btn { font: inherit; font-size: 15px; font-weight: 700; background: var(--teal); color: #fff; border: 0; border-radius: 999px; padding: 13px 28px; cursor: pointer; }
  svg { width: 100%; height: auto; display: block; }
  svg a { cursor: pointer; } svg a:focus-visible circle, svg a:focus-visible rect { stroke: var(--ink); stroke-width: 3; }
  .msg { min-height: 24px; font-size: 14px; }
</style>
  <script type="module" crossorigin src="./assets/road-CUqiEKEw.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/api-IPfG4NkI.js">
</head>
<body>
<header><div class="brand">Feynmann</div><nav><a href="start.html?step=4">My ratings</a><a href="index.html?all=1">All tests</a></nav></header>
<main>
  <h1 id="title">Your road</h1>
  <div class="soft" id="sub"></div>
  <div class="today" id="today" hidden></div>
  <div class="msg soft" id="msg" role="status"></div>
  <div id="road"></div>
</main>
</body>
</html>
